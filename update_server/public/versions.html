        <a class="skip" href="#main">跳到主要内容</a>
        <header class="shell nav">
            <a class="brand" href="/" aria-label="歌词伴侣首页"

        <main id="main">
            <section class="shell archive-hero">
                <div class="eyebrow">RELEASE ARCHIVE</div>
                <h1>每一次更新，都有迹可循。</h1>
                <p>
                    按渠道查看更新说明与历史
                    APK。正式版与测试版明确标记，下载来源分别显示。
                </p>
            </section>
            <section class="shell">
                <div class="archive-controls">
                    <div class="filters" role="group" aria-label="筛选发布渠道">
                        <button
                            type="button"
                            class="filter"
                            data-filter-channel="stable"
                            aria-pressed="true"
                        >
                            正式版</button
                        ><button
                            type="button"
                            class="filter"
                            data-filter-channel="beta"
                            aria-pressed="false"
                        >
                            测试版</button
                        ><button
                            type="button"
                            class="filter"
                            data-filter-channel="all"
                            aria-pressed="false"
                        >
                            全部渠道
                        </button>
                    </div>
                    <p
                        class="archive-count"
                        id="archive-count"
                        aria-live="polite"
                    >
                        正在读取…
                    </p>
                </div>
                <div id="archive-list" class="archive-list" aria-live="polite">
                    <p class="empty-state">正在读取版本归档…</p>
                </div>
                <div class="actions">
                    <button
                        class="button"
                        type="button"
                        id="archive-retry"
                        hidden
                    >
                        重新加载版本归档</button
                    ><a
                        class="text-link"
                        href="https://github.com/zuo-qirun/Lyrics-Companion/releases"
                        target="_blank"
                        rel="noopener noreferrer"
