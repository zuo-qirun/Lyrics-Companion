<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b14">
  <title>历史版本 · Lyrics Companion</title>
  <style>
    :root{color-scheme:dark;--ink:#f7f7fb;--muted:#a8a9bb;--line:rgba(255,255,255,.11);--accent:#c6ff5e}*{box-sizing:border-box}body{margin:0;min-width:320px;background:#090b14;color:var(--ink);font:15px/1.55 Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}body::before{content:"";position:fixed;z-index:-1;top:-23rem;right:-17rem;width:43rem;height:43rem;border-radius:50%;background:radial-gradient(circle,rgba(169,146,255,.25),transparent 66%)}a{color:inherit}.shell{width:min(900px,calc(100% - 40px));margin:auto}.nav{display:flex;justify-content:space-between;align-items:center;padding:24px 0}.brand{display:inline-flex;gap:10px;align-items:center;text-decoration:none;font-size:14px;font-weight:750}.mark{display:grid;place-items:center;width:31px;height:31px;border-radius:10px;background:linear-gradient(145deg,#d7ff92,#8a73ed);color:#11121b;font-size:18px}.back{color:#b9b9c9;font-size:14px;text-decoration:none}.hero{padding:70px 0 37px;border-bottom:1px solid var(--line)}.eyebrow{color:#d9ff95;font-size:12px;letter-spacing:.14em;font-weight:800}h1{margin:13px 0 0;font-size:clamp(38px,6vw,62px);line-height:1;letter-spacing:-.07em}.lead{margin:18px 0 0;color:var(--muted);font-size:17px}.list{padding:21px 0 65px}.item{padding:26px;margin-top:14px;border:1px solid var(--line);border-radius:23px;background:rgba(22,24,39,.72)}.item-header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.item h2{margin:0;font-size:21px;letter-spacing:-.035em}.tag{display:inline-block;padding:4px 9px;border-radius:999px;background:rgba(198,255,94,.1);color:#dcff9c;font-size:11px;font-weight:800;white-space:nowrap}.notes{margin:16px 0 20px;white-space:pre-wrap;color:var(--muted);font-size:14px}.button{display:inline-flex;align-items:center;min-height:42px;padding:0 14px;border-radius:999px;background:var(--accent);color:#13150d;font-weight:800;font-size:13px;text-decoration:none}.empty{padding:64px 20px;text-align:center;color:var(--muted)}@media(max-width:560px){.shell{width:min(100% - 32px,900px)}.hero{padding:48px 0 27px}.item{padding:21px}.item-header{display:block}.tag{margin-top:11px}}
  </style>
</head>
<body>
  <header class="shell nav"><a class="brand" href="/"><span class="mark">♪</span>LYRICS COMPANION</a><a class="back" href="/">← 返回最新版</a></header>
  <main><section class="shell hero"><div class="eyebrow">RELEASE ARCHIVE</div><h1>历史版本</h1><p class="lead">需要回到某个已发布版本时，可以在这里获取对应的 APK。</p></section><section id="list" class="shell list" aria-live="polite"><div class="empty">正在读取版本归档…</div></section></main>
  <script>
    (() => { const list = document.getElementById("list"); function appendVersion(release) { const item = document.createElement("article"); item.className = "item"; const header = document.createElement("div"); header.className = "item-header"; const title = document.createElement("h2"); title.textContent = `版本 ${release.versionName || "未命名"} (${release.versionCode || "—"})`; const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = release.downloadChannel === "github" ? "GITHUB RELEASE" : "官方镜像"; const notes = document.createElement("p"); notes.className = "notes"; notes.textContent = Array.isArray(release.changelog) ? release.changelog.join("\n") : release.changelog || "未提供更新说明。"; const download = document.createElement("a"); download.className = "button"; download.href = release.apkUrl || release.releaseUrl || "#"; download.textContent = "下载 APK ↓"; if (!release.apkUrl && !release.releaseUrl) { download.hidden = true; } header.append(title, tag); item.append(header, notes, download); list.append(item); } fetch("/versions.json", {cache:"no-store"}).then((response) => { if (!response.ok) throw new Error("versions unavailable"); return response.json(); }).then((data) => { list.textContent = ""; const versions = Array.isArray(data.versions) ? data.versions : []; if (!versions.length) { list.innerHTML = '<div class="empty">暂时没有历史版本。</div>'; return; } versions.forEach(appendVersion); }).catch(() => { list.innerHTML = '<div class="empty">版本归档暂时不可用，请稍后重试。</div>'; }); })();
  </script>
</body>
</html>
