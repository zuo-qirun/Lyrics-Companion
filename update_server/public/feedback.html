<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#11110e">
  <title>收件箱 · Lyrics Companion</title>
  <style>
    :root{--paper:#f1efe5;--ink:#181815;--quiet:#6e6c63;--rule:#cac7b8;--acid:#d6ff43;--alert:#ee5a39;--panel:#fcfbf5;--shadow:0 18px 55px rgba(44,39,25,.12)}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--paper);color:var(--ink);font:15px/1.52 "Noto Serif SC","Songti SC",STSong,serif}body:before{content:"";position:fixed;z-index:-1;inset:0;background:repeating-linear-gradient(0deg,rgba(69,64,46,.035) 0 1px,transparent 1px 5px);pointer-events:none}button,input,textarea{font:inherit}.shell{width:min(1260px,calc(100% - 42px));margin:auto}.masthead{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:31px 0 24px;border-bottom:2px solid var(--ink)}.brand{font-family:"Bodoni 72",Didot,serif;font-size:24px;letter-spacing:-.045em}.brand span{display:block;font:700 10px/1.2 ui-monospace,monospace;letter-spacing:.14em;color:var(--quiet)}.stamp{padding:6px 10px;border:1px solid var(--ink);font:700 10px/1 ui-monospace,monospace;letter-spacing:.11em}.intro{display:grid;grid-template-columns:1.4fr .6fr;gap:42px;padding:49px 0 34px}.eyebrow{font:700 11px/1 ui-monospace,monospace;letter-spacing:.14em;color:#55564c}.intro h1{max-width:720px;margin:10px 0 0;font-family:"Bodoni 72",Didot,serif;font-size:clamp(47px,7vw,88px);font-weight:500;letter-spacing:-.065em;line-height:.9}.intro p{align-self:end;margin:0 0 4px;color:var(--quiet);font-size:16px}.auth{display:flex;gap:8px;padding:14px;border:1px solid var(--rule);background:rgba(255,255,255,.36)}.auth input{min-width:0;flex:1;padding:10px 11px;border:1px solid var(--rule);border-radius:0;background:#fffef9;color:var(--ink);outline-color:var(--ink)}.button{border:1px solid var(--ink);border-radius:0;padding:10px 15px;background:var(--acid);color:var(--ink);font:700 12px/1 ui-monospace,monospace;letter-spacing:.07em;cursor:pointer}.button:hover{background:#c2ec2e}.button:disabled{cursor:wait;opacity:.55}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}.tabs{display:flex;gap:4px}.tab{border:0;padding:7px 10px;background:transparent;color:var(--quiet);font:700 12px/1 ui-monospace,monospace;letter-spacing:.08em;cursor:pointer}.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}.status{color:var(--quiet);font:12px/1.3 ui-monospace,monospace}.inbox{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;padding:25px 0 72px}.list{min-height:360px}.ticket{display:grid;grid-template-columns:105px 1fr;gap:18px;padding:20px 0;border-bottom:1px solid var(--rule);cursor:pointer}.ticket:hover .ticket-message{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}.ticket.selected{margin:0 -14px;padding:20px 14px;background:#e5e1d2}.ticket-meta{font:11px/1.5 ui-monospace,monospace;color:var(--quiet);word-break:break-word}.ticket-message{font-size:17px;white-space:pre-wrap;word-break:break-word}.badge{display:inline-block;margin-top:7px;padding:2px 5px;background:var(--acid);font:700 10px/1 ui-monospace,monospace}.badge.crash{background:#ffb5a3}.detail{position:sticky;top:20px;align-self:start;min-height:350px;padding:23px;background:var(--panel);border:1px solid var(--ink);box-shadow:var(--shadow)}.detail.empty{display:grid;place-items:center;color:var(--quiet);font-size:16px}.detail-head{padding-bottom:15px;border-bottom:1px solid var(--rule)}.detail-head h2{margin:0;font:500 30px/.95 "Bodoni 72",Didot,serif;letter-spacing:-.05em}.detail-info{margin-top:10px;color:var(--quiet);font:11px/1.55 ui-monospace,monospace;word-break:break-word}.body{margin:20px 0;white-space:pre-wrap;word-break:break-word}.replies{border-top:1px solid var(--rule);padding-top:15px}.reply{margin:0 0 13px;padding:11px 12px;background:#eceadf;white-space:pre-wrap;word-break:break-word}.reply small{display:block;margin-bottom:4px;color:var(--quiet);font:10px/1 ui-monospace,monospace}.composer{margin-top:17px}.composer textarea{display:block;width:100%;min-height:100px;resize:vertical;padding:10px;border:1px solid var(--rule);background:#fffef9;color:var(--ink);outline-color:var(--ink)}.composer .button{margin-top:8px}.diagnostic{padding:20px 0;border-bottom:1px solid var(--rule)}.diagnostic summary{cursor:pointer;font:700 13px/1.5 ui-monospace,monospace}.diagnostic summary span{color:var(--alert)}.diagnostic pre{max-height:330px;overflow:auto;margin:12px 0 0;padding:14px;background:#202019;color:#e8e6d9;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}.notice{padding:42px 20px;color:var(--quiet);text-align:center}.hidden{display:none!important}@media(max-width:820px){.shell{width:min(100% - 28px,1260px)}.intro{grid-template-columns:1fr;gap:20px;padding-top:38px}.inbox{grid-template-columns:1fr}.detail{position:static}.ticket{grid-template-columns:82px 1fr}.masthead{padding-top:21px}}
  </style>
</head>
<body>
  <header class="shell masthead"><div class="brand">Lyrics Companion<span>PRIVATE SUPPORT DESK</span></div><div class="stamp">ADMIN ONLY</div></header>
  <main class="shell">
    <section class="intro"><div><div class="eyebrow">FIELD NOTES / DIAGNOSTICS</div><h1>把每一次<br>问题，变成线索。</h1></div><p>反馈、回信与客户端诊断记录集中在这里。访问令牌仅保存在本次浏览会话中。</p></section>
    <form id="auth" class="auth"><input id="token" type="password" autocomplete="current-password" placeholder="ADMIN_TOKEN" aria-label="管理员令牌"><button class="button">进入收件箱</button></form>
    <section id="workspace" class="hidden"><div class="toolbar"><div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="feedback" aria-selected="true">反馈收件箱</button><button class="tab" role="tab" data-tab="diagnostics" aria-selected="false">诊断记录</button></div><span id="status" class="status">等待加载</span></div><div id="feedback-panel" class="inbox"><div id="feedback-list" class="list"></div><aside id="detail" class="detail empty">选择一条反馈，查看详情并回复。</aside></div><div id="diagnostics-panel" class="hidden"></div></section>
  </main>
  <script>
    (() => {
      const state={token:sessionStorage.getItem("lyrics-admin-token")||"",feedback:[],diagnostics:[],selected:null};
      const $=(id)=>document.getElementById(id); const status=$("status"); const workspace=$("workspace");
      $("token").value=state.token;
      function request(path, options={}){const headers={...(options.headers||{}),Authorization:`Bearer ${state.token}`};return fetch(path,{...options,headers}).then(async r=>{const body=await r.json().catch(()=>({}));if(!r.ok||!body.ok)throw new Error(body.error||`HTTP ${r.status}`);return body;});}
      function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
      function date(value){try{return new Date(value).toLocaleString("zh-CN",{hour12:false});}catch(_){return value||"";}}
      function setStatus(value){status.textContent=value;}
      async function load(){setStatus("正在读取…");const [feedback,diagnostics]=await Promise.all([request("/api/admin/feedback?limit=150"),request("/api/admin/diagnostics?limit=30")]);state.feedback=feedback.feedback||[];state.diagnostics=diagnostics.diagnostics||[];workspace.classList.remove("hidden");renderFeedback();renderDiagnostics();setStatus(`已同步 ${new Date().toLocaleTimeString("zh-CN",{hour12:false})}`);}
      function renderFeedback(){const list=$("feedback-list");list.textContent="";if(!state.feedback.length){list.append(node("div","notice","暂时没有反馈。"));return;}for(const item of state.feedback){const row=node("article",`ticket${state.selected&&state.selected.id===item.id?" selected":""}`);row.onclick=()=>{state.selected=item;renderFeedback();renderDetail();};const meta=node("div","ticket-meta",`${date(item.createdAt)}\n${item.appVersion||"未知版本"}`);if((item.replies||[]).length)meta.append(node("span","badge",`${item.replies.length} 条回信`));const message=node("div","ticket-message",item.message);row.append(meta,message);list.append(row);}renderDetail();}
      function renderDetail(){const detail=$("detail"),item=state.selected;detail.textContent="";if(!item){detail.className="detail empty";detail.textContent="选择一条反馈，查看详情并回复。";return;}detail.className="detail";const head=node("div","detail-head"),title=node("h2","","用户反馈"),info=node("div","detail-info",`${date(item.createdAt)}\n版本：${item.appVersion||"未知"}\n联系方式：${item.contact||"未留下"}\n编号：${item.id}`);head.append(title,info);detail.append(head,node("div","body",item.message));const replies=node("section","replies");replies.append(node("div","eyebrow","已发送的回信"));for(const reply of item.replies||[]){const block=node("div","reply"),small=node("small","",date(reply.createdAt));block.append(small,document.createTextNode(reply.message));replies.append(block);}const composer=node("form","composer"),input=node("textarea","","");input.placeholder="写一封回复；用户下次打开应用会看到。";input.required=true;const send=node("button","button","发送回复");composer.append(input,send);composer.onsubmit=async(e)=>{e.preventDefault();send.disabled=true;try{await request(`/api/admin/feedback/${item.id}/replies`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({message:input.value})});input.value="";await load();state.selected=state.feedback.find(x=>x.id===item.id)||null;renderFeedback();}catch(error){alert(`发送失败：${error.message}`);}finally{send.disabled=false;}};replies.append(composer);detail.append(replies);}
      function renderDiagnostics(){const panel=$("diagnostics-panel");panel.textContent="";if(!state.diagnostics.length){panel.append(node("div","notice","暂时没有诊断记录。"));return;}for(const item of state.diagnostics){const block=node("details","diagnostic"),title=node("summary","",`${date(item.createdAt)} · ${item.appVersion||"未知版本"} · `),kind=node("span","",item.kind==="crash"?"闪退":"诊断快照"),pre=node("pre","",`${item.summary||"无摘要"}\n\n${item.details||"无详细内容"}`);title.append(kind);block.append(title,pre);panel.append(block);}}
      $("auth").onsubmit=async(e)=>{e.preventDefault();state.token=$("token").value.trim();if(!state.token)return;try{await load();sessionStorage.setItem("lyrics-admin-token",state.token);}catch(error){workspace.classList.add("hidden");alert(`无法进入：${error.message}`);}};
      document.querySelectorAll(".tab").forEach(tab=>tab.onclick=()=>{const diagnostic=tab.dataset.tab==="diagnostics";document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===tab)));$("feedback-panel").classList.toggle("hidden",diagnostic);$("diagnostics-panel").classList.toggle("hidden",!diagnostic);});
      if(state.token) load().catch(()=>sessionStorage.removeItem("lyrics-admin-token"));
    })();
  </script>
</body>
</html>
