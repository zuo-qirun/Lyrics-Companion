plugins {
    id "com.android.application"
}

def releaseStoreFile = System.getenv("APP_SIGNING_STORE_FILE")
def releaseStorePassword = System.getenv("APP_SIGNING_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("APP_SIGNING_KEY_ALIAS")
def releaseKeyPassword = System.getenv("APP_SIGNING_KEY_PASSWORD")
def releaseSigningReady = releaseStoreFile && releaseStorePassword
        && releaseKeyAlias && releaseKeyPassword

android {
    namespace "com.zuoqirun.lyricscompanion"
    compileSdk 36

    defaultConfig {
        applicationId "com.zuoqirun.lyricscompanion"
        minSdk 19
        targetSdk 36
        versionCode Integer.parseInt(System.getenv("APP_VERSION_CODE") ?: "1")
        versionName System.getenv("APP_VERSION_NAME") ?: "0.1.0"
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Last releases in these lines that still support Android 4.4 (API 19).
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.12.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
